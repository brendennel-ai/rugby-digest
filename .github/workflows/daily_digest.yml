name: Rugby Daily Digest

on:
  schedule:
    - cron: '0 4 * * *'   # 4am UTC = 6am CAT every day
  workflow_dispatch:        # lets you trigger manually from GitHub UI

permissions:
  contents: write           # needed to push seen_stories.json back to the repo

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rugby digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python rugby_digest.py

      - name: Save seen stories and digest page
        run: |
          git config user.name "Rugby Digest Bot"
          git config user.email "action@github.com"
          git add seen_stories.json docs/daily.html
          git diff --cached --quiet || git commit -m "chore: update daily digest [skip ci]"
          git push
