<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rugby Digest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1a4d2e">
<style>
  :root { color-scheme: light; }
  body {
    margin:0; min-height:100vh; background:#f7f5f0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-family: Georgia, serif; color:#1a4d2e; margin-bottom:4px; }
  p.sub { color:#888; margin-top:0; }
  .cards { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; padding:0 16px; }
  .card {
    width:220px; padding:24px; border-radius:12px; background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.08); text-decoration:none; text-align:center;
  }
  .card h2 { font-size:17px; color:#1a1a1a; margin:0 0 6px; }
  .card p { font-size:13px; color:#888; margin:0; }
</style>
</head>
<body>
<h1>🏉 Rugby Digest</h1>
<p class="sub">Updated automatically, once a day</p>
<div class="cards">
  <a class="card" href="daily.html">
    <h2>Daily Digest</h2>
    <p>Top rugby news worldwide, ranked</p>
  </a>
  <a class="card" href="teams.html">
    <h2>Team News</h2>
    <p>Official team &amp; club updates</p>
  </a>
</div>
</body>
</html>
